name: collect

on:
  schedule:
    # UTC 00:00 = 马来西亚时间 08:00。
    # GitHub Actions 定时常有 5–30 分钟延迟，代码不得假设精确触发时间。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      keyword_slug:
        description: '只跑这一个关键词'
        required: false
        type: string
      run_id:
        description: '由 API 预建的 run 记录 id'
        required: false
        type: string
      force:
        description: '忽略今天已跑过'
        required: false
        type: boolean
        default: false

concurrency:
  # 防止 cron 与手动触发同时跑同一个关键词
  group: collect-${{ github.event.inputs.keyword_slug || 'all' }}
  cancel-in-progress: false      # 排队，不取消

jobs:
  collect:
    runs-on: ubuntu-latest
    # 必须设：防止浏览器卡死跑满 6 小时额度
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      # 缓存浏览器每次省 2–3 分钟
      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/camoufox
          key: browsers-${{ hashFiles('worker/requirements.txt') }}

      - name: Install browsers
        run: scrapling install

      - name: Run collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 下面两项必须带 `|| '默认值'`：Variable 未设置时 ${{ vars.X }} 展开成
          # **空串**（环境变量存在但为空），Python 侧的 os.environ.get(name, default)
          # 拿不到默认值。config.py 的 _str_env 也做了同样的兜底，两边都防一道。
          #
          # AI 开关。留 false 则完全不调 Anthropic，也不花钱，
          # 简报按文章标题机械生成。想开 AI：Settings → Variables 加
          # AI_ENABLED=true，并把 ANTHROPIC_API_KEY 填进 Secrets。
          AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
          # 配图后端：supabase（默认，无需绑卡）或 r2。选 r2 才需要下面四项。
          IMAGES_BACKEND: ${{ vars.IMAGES_BACKEND || 'supabase' }}
          # 只有 IMAGES_BACKEND=r2 时才需要；没配这几个 Secret 也不会报错
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_IMAGES: ${{ secrets.R2_BUCKET_IMAGES }}
        run: |
          ARGS="run"
          if [ -n "${{ github.event.inputs.keyword_slug }}" ]; then
            ARGS="$ARGS --keyword ${{ github.event.inputs.keyword_slug }}"
          fi
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            ARGS="$ARGS --run-id ${{ github.event.inputs.run_id }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python -m worker.main $ARGS
