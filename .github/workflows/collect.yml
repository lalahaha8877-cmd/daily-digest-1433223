name: collect

on:
  schedule:
    # UTC 00:00 = 马来西亚时间 08:00。
    # GitHub Actions 定时常有 5–30 分钟延迟，代码不得假设精确触发时间。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      keyword_slug:
        description: '只跑这一个关键词'
        required: false
        type: string
      run_id:
        description: '由 API 预建的 run 记录 id'
        required: false
        type: string
      force:
        description: '忽略今天已跑过'
        required: false
        type: boolean
        default: false

concurrency:
  # 防止 cron 与手动触发同时跑同一个关键词
  group: collect-${{ github.event.inputs.keyword_slug || 'all' }}
  cancel-in-progress: false      # 排队，不取消

jobs:
  collect:
    runs-on: ubuntu-latest
    # 必须设：防止浏览器卡死跑满 6 小时额度
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      # 缓存浏览器每次省 2–3 分钟
      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/camoufox
          key: browsers-${{ hashFiles('worker/requirements.txt') }}

      - name: Install browsers
        run: scrapling install

      - name: Run collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_IMAGES: ${{ secrets.R2_BUCKET_IMAGES }}
        run: |
          ARGS="run"
          if [ -n "${{ github.event.inputs.keyword_slug }}" ]; then
            ARGS="$ARGS --keyword ${{ github.event.inputs.keyword_slug }}"
          fi
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            ARGS="$ARGS --run-id ${{ github.event.inputs.run_id }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python -m worker.main $ARGS
